name: Toolkit checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy capcut_toolkit
      - run: python -m compileall -q capcut_toolkit
      - run: python -m build --no-isolation
      - run: python -m pip_audit --no-deps --disable-pip -r requirements.lock
      - run: python scripts/check_release.py

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: sudo apt-get update
      - run: sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.lock
      - name: Fetch pinned engine
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/sun-guannan/VectCutAPI.git vendor/VectCutAPI
          revision=$(python -c 'import json; print(json.load(open("upstream.json"))["commit"])')
          git -C vendor/VectCutAPI checkout --detach "$revision"
      - name: Test synthetic media and isolated deployment
        env:
          CAPCUT_TOOLKIT_ENGINE: ${{ github.workspace }}/vendor/VectCutAPI
        run: python -m unittest discover -s tests -p test_engine_integration.py -v
