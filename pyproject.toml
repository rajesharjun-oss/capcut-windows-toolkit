[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capcut-windows-toolkit"
version = "0.1.0"
description = "Local, plan-driven CapCut Desktop draft tooling for Codex on Windows"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
capcut-toolkit = "capcut_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["capcut_toolkit*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
files = ["capcut_toolkit"]
